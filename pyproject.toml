[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dtr-server"
version = "0.1.0"
description = "HL7 Da Vinci DTR Payer Server (FastAPI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "fastapi>=0.115.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.20",
    "pyjwt[crypto]>=2.10.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dtr_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
